name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install lavapipe (software Vulkan), the validation layer and a virtual X server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers xvfb
      - name: Install the Vulkan runtime, the validation layer and lavapipe (software Vulkan)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        # Authenticated, so fetching lavapipe's release doesn't hit the anonymous GitHub API rate limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install_runtime: true
          install_lavapipe: true
          cache: true
      # Beside the tests and samples, NGX finds no DLSS on these GPUs, so the devices turn it off as on every GPU without it.
      - name: Build the engine's DLSS library
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then pwsh -File Source/Native/Dlss/build.ps1; else bash Source/Native/Dlss/build.sh; fi
      - name: Build the engine and the samples, and pack the engine
        shell: bash
        run: |
          dotnet build FlickerVoidNGN.slnx -c Release
          dotnet build Samples/FlickerVoid.Samples.slnx -c Release
          dotnet pack FlickerVoidNGN.slnx -c Release --no-build
      - name: Test
        shell: bash
        # Linux opens the swapchain tests' windows on a virtual X server.
        run: |
          display=""
          if [ "$RUNNER_OS" = "Linux" ]; then display="xvfb-run -a"; fi
          $display dotnet test --solution FlickerVoidNGN.slnx -c Release --no-build
        env:
          # llvmpipe's linear rasterizer reads push constants past the first 16 bytes as zero on full-rectangle draws.
          LP_PERF: no_rast_linear
      - name: Create a project from the template, build it and run it on lavapipe (under Xvfb on Linux)
        shell: bash
        env:
          FLICKERVOID_ENGINE: ${{ github.workspace }}
          LP_PERF: no_rast_linear
        run: |
          display=""
          if [ "$RUNNER_OS" = "Linux" ]; then display="xvfb-run -a"; fi
          dotnet new install ./Templates/Project
          dotnet new flickervoid -n TemplateCheck -o "$RUNNER_TEMP/TemplateCheck" --engine "$FLICKERVOID_ENGINE"
          cd "$RUNNER_TEMP/TemplateCheck"
          dotnet build TemplateCheck.slnx -c Release
          $display dotnet run --project Source/Launcher -c Release --no-build -- --validation --frames 60
      - name: Publish the samples with NativeAOT
        shell: bash
        run: |
          dotnet publish Samples/FallingBodies -c Release --use-current-runtime -o artifacts/aot/FallingBodies
          dotnet publish Samples/Window -c Release --use-current-runtime -o artifacts/aot/Window
          dotnet publish Samples/TexturedMesh -c Release --use-current-runtime -o artifacts/aot/TexturedMesh
          dotnet publish Samples/SceneViewer -c Release --use-current-runtime -o artifacts/aot/SceneViewer
      - name: Run the samples
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          ./artifacts/aot/FallingBodies/FlickerVoid.Samples.FallingBodies
          ./artifacts/aot/Window/FlickerVoid.Samples.Window --frames 120
      - name: Run the textured mesh and scene viewer samples on lavapipe (under Xvfb on Linux)
        shell: bash
        env:
          LP_PERF: no_rast_linear
        run: |
          display=""
          if [ "$RUNNER_OS" = "Linux" ]; then display="xvfb-run -a"; fi
          $display ./artifacts/aot/TexturedMesh/FlickerVoid.Samples.TexturedMesh --validation --frames 120
          $display ./artifacts/aot/SceneViewer/FlickerVoid.Samples.SceneViewer --validation --frames 120 --lights 8 --moods Moods/Day.fvmood,Moods/Night.fvmood
          $display ./artifacts/aot/SceneViewer/FlickerVoid.Samples.SceneViewer --validation --frames 60 --scene Scenes/PaintedRoom.fvscene --moods Moods/Night.fvmood

  # The game built and tested on the engine as this change leaves it: Bleeders' branch of the same name when there is one, else its main.
  game:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      FLICKERVOID_ENGINE: ${{ github.workspace }}/FlickerVoidNGN
    steps:
      - uses: actions/checkout@v6
        with:
          path: FlickerVoidNGN
      - name: Find the game's branch
        id: game
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if git ls-remote --exit-code --heads https://github.com/tec-sx/Bleeders.git "$BRANCH" > /dev/null; then ref="$BRANCH"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: tec-sx/Bleeders
          ref: ${{ steps.game.outputs.ref }}
          path: Bleeders
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: Bleeders/global.json
      - name: Build and test the game
        working-directory: Bleeders
        run: |
          dotnet build Bleeders.slnx -c Release
          dotnet test --solution Bleeders.slnx -c Release --no-build

  # When main's engine version (Source/Directory.Build.props) has no tag yet, tag the commit v<Version> and pack the engine modules.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Find the engine version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild Source/Engine/Runtime/FlickerVoid.Engine.Runtime.csproj -getProperty:Version)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag the version
        if: steps.version.outputs.new == 'true'
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}
      - name: Pack the engine modules
        if: steps.version.outputs.new == 'true'
        run: dotnet pack FlickerVoidNGN.slnx -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.new == 'true'
        with:
          name: FlickerVoid.Engine-${{ steps.version.outputs.tag }}
          path: artifacts/packages/*.nupkg
