name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install lavapipe (software Vulkan), the validation layer and a virtual X server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers xvfb
      - run: dotnet build FlickerVoidNGN.slnx -c Release
      - name: Test
        shell: bash
        # Linux opens the swapchain tests' windows on a virtual X server.
        run: |
          display=""
          if [ "$RUNNER_OS" = "Linux" ]; then display="xvfb-run -a"; fi
          $display dotnet test --solution FlickerVoidNGN.slnx -c Release --no-build
        env:
          # llvmpipe's linear rasterizer reads push constants past the first 16 bytes as zero on full-rectangle draws.
          LP_PERF: no_rast_linear
      - name: Publish the samples with NativeAOT
        shell: bash
        run: |
          dotnet publish Samples/FallingBodies -c Release --use-current-runtime -o artifacts/aot/FallingBodies
          dotnet publish Samples/Window -c Release --use-current-runtime -o artifacts/aot/Window
      - name: Run the samples
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          ./artifacts/aot/FallingBodies/FlickerVoid.Samples.FallingBodies
          ./artifacts/aot/Window/FlickerVoid.Samples.Window --frames 120
